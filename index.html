<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <meta name="description" content="Простые заметки, списки дел и напоминания в одном месте.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Моменты — заметки</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✳</span><span>моменты</span></div>
      <button class="icon-button" id="notificationButton" aria-label="Включить уведомления" title="Уведомления">♧</button>
    </header>

    <main>
      <section class="greeting">
        <p class="eyebrow" id="todayLabel"></p>
        <h1>Привет! <span>Что важно сегодня?</span></h1>
        <p class="subtitle">Запиши, чтобы не держать в голове.</p>
      </section>

      <div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="Найти заметку…" aria-label="Найти заметку"></div>

      <section id="reminderPanel" class="reminder-panel hidden" aria-live="polite">
        <div class="panel-heading"><span>⏰</span><h2>Напоминания</h2></div>
        <div id="reminderList"></div>
      </section>

      <div class="section-heading"><div><p class="eyebrow">ТВОЁ ПРОСТРАНСТВО</p><h2>Мои записи <span id="noteCount" class="count"></span></h2></div>
        <div class="filters" role="group" aria-label="Фильтр заметок"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="pinned">Важное</button><button class="filter" data-filter="tasks">Списки</button></div>
      </div>
      <section id="notesGrid" class="notes-grid" aria-live="polite"></section>
      <div id="emptyState" class="empty-state hidden"><div class="empty-icon">✎</div><h3>Здесь пока тихо</h3><p>Создай первую заметку — мысли любят порядок.</p><button class="primary-button" id="emptyCreate">＋ Новая заметка</button></div>
    </main>

    <button class="compose-button" id="createButton"><span>＋</span> Новая заметка</button>
    <footer>Твои записи хранятся на этом устройстве <span>·</span> <button id="installButton" class="text-button hidden">Установить приложение</button></footer>
  </div>

  <dialog id="noteDialog" class="note-dialog">
    <form id="noteForm" method="dialog">
      <div class="dialog-top"><span class="eyebrow" id="dialogEyebrow">НОВАЯ ЗАПИСЬ</span><button type="button" class="icon-button close-button" id="closeDialog" aria-label="Закрыть">×</button></div>
      <label class="field-label" for="noteTitle">Заголовок</label><input id="noteTitle" class="title-input" maxlength="90" placeholder="Например, идеи на выходные">
      <label class="field-label" for="noteBody">Текст заметки</label><textarea id="noteBody" rows="5" placeholder="Запиши всё, что не хочется забыть…"></textarea>
      <div class="form-row"><label class="check-label"><input id="taskMode" type="checkbox"><span>Список дел</span></label><label class="check-label"><input id="pinMode" type="checkbox"><span>Закрепить</span></label></div>
      <div id="taskEditor" class="task-editor hidden"><label class="field-label" for="taskInput">Добавить пункт</label><div class="add-task-row"><input id="taskInput" placeholder="Что нужно сделать?"><button type="button" id="addTaskButton" class="small-button">Добавить</button></div><ul id="draftTasks" class="draft-tasks"></ul></div>
      <label class="field-label" for="reminderAt">Напомнить мне <span class="optional">необязательно</span></label><input id="reminderAt" class="date-input" type="datetime-local">
      <div class="dialog-actions"><button type="button" class="secondary-button" id="cancelButton">Отмена</button><button type="submit" class="primary-button">Сохранить</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
